name: Qiita auto-publish

# 動作:
#   - cron: 毎日 01:00 UTC (10:00 JST) に新規記事をチェック
#   - workflow_dispatch: 手動実行可
# 安全策:
#   - スクリプト側で 1 回の実行で 1 件のみ投稿
#   - レビューレポートが未合格の記事は skip
#   - frontmatter の published が true の記事のみ対象
#   - 投稿後は qiita_id を frontmatter に書き戻して commit

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Qiita publisher
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: node scripts/post-to-qiita.mjs

      - name: Commit qiita_id back if posted
        run: |
          if [[ -n "$(git status --porcelain qiita/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add qiita/
            git commit -m "chore: record qiita_id after successful POST"
            git push
          else
            echo "No changes to commit"
          fi
