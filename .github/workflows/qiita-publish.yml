name: Qiita auto-publish

# 動作:
#   - cron: 毎日 01:00 UTC (10:00 JST) に新規記事をチェック
#   - workflow_dispatch: 手動実行可
# 安全策:
#   - スクリプト側で 1 回の実行で 1 件のみ投稿
#   - レビュー未合格は qiita/_drafts/ に置く運用、qiita/ 直下のみ拾う
#   - validate-articles.mjs で frontmatter / SEO / secret パターンを事前検査
#   - GHA actions は SHA ピン留め（supply chain 攻撃対策）
#   - permissions は default read-only、job 単位で contents:write のみ付与
#   - concurrency で並列実行禁止（重複投稿事故の防止）

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

# 既定で全パーミッションを read-only にする（明示的に上げた job のみ書ける）
permissions:
  contents: read

concurrency:
  group: qiita-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        # actions/checkout@v4 — SHA pinned for supply chain safety
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Use Node.js 24 LTS
        # actions/setup-node@v4 — SHA pinned
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Validate articles (frontmatter / SEO / secret scan)
        run: node scripts/validate-articles.mjs

      - name: Run Qiita publisher
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: node scripts/post-to-qiita.mjs

      - name: Commit qiita_id back if posted
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain qiita/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qiita/
            git commit -m "chore: record qiita_id after successful POST"
            git push
          else
            echo "No changes to commit"
          fi
